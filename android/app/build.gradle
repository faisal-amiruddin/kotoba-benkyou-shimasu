plugins { id 'com.android.application' }
apply from: '../common-android.gradle'
android {
    ndkVersion '27.2.12479018'
    defaultConfig {
        manifestPlaceholders = [appLabel: 'Kotoba Full · Belajar Jepang']
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        externalNativeBuild { cmake { cppFlags '-std=c++17'; arguments '-DANDROID_STL=c++_shared' } }
    }
    sourceSets {
        main.java.srcDir 'src/full/java'
        main.assets.srcDir 'src/full/assets'
        main.jniLibs.srcDirs = ['src/full/jniLibs']
    }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    packaging { jniLibs { useLegacyPackaging true; keepDebugSymbols += ['**/libvoicevox_core.so','**/libvoicevox_onnxruntime.so'] } }
    androidResources { noCompress += ['vvm'] }
}
