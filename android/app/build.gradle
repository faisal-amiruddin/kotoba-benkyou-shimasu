plugins { id 'com.android.application' }

android {
    namespace 'id.kotoba.studio'
    compileSdk 35
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId 'id.kotoba.studio'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        externalNativeBuild { cmake { cppFlags '-std=c++17'; arguments '-DANDROID_STL=c++_shared' } }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    packaging { jniLibs { useLegacyPackaging true; keepDebugSymbols += ['**/libvoicevox_core.so','**/libvoicevox_onnxruntime.so'] } }
    androidResources { noCompress += ['vvm'] }
    buildTypes { debug { debuggable true }; release { minifyEnabled false } }
}
dependencies { implementation 'androidx.webkit:webkit:1.12.1' }
